<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blopus</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
      height: 100%;
    }

    /* ── Pill shell ─────────────────────────────────────────────────────── */
    #pill {
      width: 320px;
      height: 52px;
      background: linear-gradient(135deg,
        rgba(0, 8, 35, 0.97) 0%,
        rgba(0, 40, 90, 0.93) 25%,
        rgba(0, 15, 55, 0.96) 50%,
        rgba(0, 55, 100, 0.92) 75%,
        rgba(0, 8, 35, 0.97) 100%);
      background-size: 300% 300%;
      animation: gradShift 7s ease infinite;
      backdrop-filter: blur(60px) saturate(160%) brightness(0.75);
      -webkit-backdrop-filter: blur(60px) saturate(160%) brightness(0.75);
      border: 1px solid rgba(0, 210, 255, 0.28);
      border-radius: 28px;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 320px;
    }

    #notif.show {
      visibility: visible;
      opacity: 1;
    }

    #notif {
      margin: 6px 0 0 12px;
      padding: 8px 13px;
      font-size: 12.5px;
      line-height: 1.45;
      color: rgba(190, 230, 255, 0.92);
      background: rgba(0, 40, 90, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 180, 255, 0.22);
      border-radius: 14px;
      border-top-left-radius: 4px;
      max-width: 290px;
      overflow: visible;
      animation: fadeUp 0.25s ease;
      cursor: pointer;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
    }

    @keyframes gradShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* top cyan shimmer line */
    #pill::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(0, 220, 255, 0.55) 40%,
        rgba(100, 240, 255, 0.4) 60%,
        transparent);
      border-radius: 1px;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 52px;
      cursor: grab;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    #header:active { cursor: grabbing; }
    #header:hover { background: rgba(0, 200, 255, 0.04); }

    /* pulsing dot */
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #00d4ff;
      box-shadow: 0 0 8px #00d4ff, 0 0 20px rgba(0, 212, 255, 0.5);
      flex-shrink: 0;
      margin-right: 10px;
    }
    .dot.pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 6px #00d4ff, 0 0 16px rgba(0,212,255,0.4); opacity:1; }
      50%      { box-shadow: 0 0 16px #00d4ff, 0 0 40px rgba(0,212,255,0.6); opacity:0.7; }
    }

    /* brand */
    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(180, 235, 255, 0.95);
      flex-shrink: 0;
      margin-right: 10px;
      text-transform: lowercase;
    }

    /* preview — hidden, used only as internal state tracker */
    #preview { display: none; }

    /* chevron */
    #chevron {
      font-size: 10px;
      color: rgba(0, 200, 255, 0.4);
      margin-left: 8px;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }
    #chevron.open { transform: rotate(180deg); }

    /* ── Divider ────────────────────────────────────────────────────────── */
    #divider {
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(0, 200, 255, 0.22) 30%,
        rgba(0, 220, 255, 0.15) 70%,
        transparent);
      flex-shrink: 0;
      display: none;
    }

    /* ── Chat area ──────────────────────────────────────────────────────── */
    #chat-area {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 200, 255, 0.2) transparent;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb {
      background: rgba(0, 200, 255, 0.25);
      border-radius: 2px;
    }

    .msg {
      max-width: 92%;
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.6;
      animation: fadeUp 0.2s ease;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* blopus bubble — glassy cyan tint */
    .msg.blopus {
      align-self: flex-start;
      background: rgba(0, 60, 110, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 190, 255, 0.22);
      border-bottom-left-radius: 4px;
      color: rgba(200, 235, 255, 0.95);
    }

    /* user bubble */
    .msg.user {
      align-self: flex-end;
      background: rgba(0, 30, 65, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 160, 210, 0.18);
      border-bottom-right-radius: 4px;
      color: rgba(160, 210, 240, 0.9);
    }

    .msg ul { margin: 4px 0 4px 16px; padding: 0; }
    .msg li  { margin: 2px 0; }
    .msg strong { color: rgba(150, 220, 255, 0.95); }

    .dots {
      display: inline-block;
      animation: dotPulse 1.2s ease-in-out infinite;
      letter-spacing: 2px;
      font-size: 16px;
      color: rgba(0, 200, 255, 0.7);
    }
    @keyframes dotPulse {
      0%,100% { opacity: 0.3; } 50% { opacity: 1; }
    }

    .msg-time {
      font-size: 9.5px;
      color: rgba(0, 180, 220, 0.35);
      margin-top: 3px;
      text-align: right;
    }
    .msg.blopus .msg-time { text-align: left; }

    /* ── Input row ──────────────────────────────────────────────────────── */
    #input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 13px;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      background: rgba(0, 40, 80, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 190, 255, 0.22);
      border-radius: 22px;
      padding: 9px 15px;
      font-size: 13px;
      font-family: inherit;
      color: rgba(200, 235, 255, 0.95);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #input::placeholder { color: rgba(0, 180, 230, 0.32); }
    #input:focus {
      border-color: rgba(0, 210, 255, 0.45);
      box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.08),
                  0 0 16px rgba(0, 180, 255, 0.1);
    }

    #send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #00c8ff 0%, #0077e6 100%);
      box-shadow: 0 0 14px rgba(0, 200, 255, 0.4);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px rgba(0, 200, 255, 0.6);
    }
    #send-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

<div id="wrap">
<div id="pill">
  <div id="header">
    <div class="dot pulse" id="dot"></div>
    <span class="brand">blopus</span>
    <span id="preview">hey. i'm watching.</span>
    <span id="chevron">▲</span>
  </div>

  <div id="divider"></div>

  <div id="chat-area">
    <div id="messages"></div>
    <div id="input-row">
      <input id="input" type="text" placeholder="say something..." autocomplete="off" />
      <button id="send-btn">➤</button>
    </div>
  </div>
</div>
  <div id="notif"></div>
</div>

<script>
  const COLLAPSED_H = 110
  const EXPANDED_H  = 560

  let expanded = false

  const pill     = document.getElementById('pill')
  const header   = document.getElementById('header')
  const divider  = document.getElementById('divider')
  const chatArea = document.getElementById('chat-area')
  const messages = document.getElementById('messages')
  const preview  = document.getElementById('preview')
  const notif    = document.getElementById('notif')
  const dot      = document.getElementById('dot')
  const chevron  = document.getElementById('chevron')
  const input    = document.getElementById('input')
  const sendBtn  = document.getElementById('send-btn')

  // ── Manual drag ───────────────────────────────────────────────────────────
  let dragging   = false
  let dragOrigin = null
  let hasMoved   = false
  let lastTarget = null

  // Drag from anywhere on the pill except interactive elements
  pill.addEventListener('mousedown', e => {
    if (e.button !== 0) return
    const tag = e.target.tagName.toLowerCase()
    if (tag === 'input' || tag === 'button') return
    dragging   = true
    hasMoved   = false
    lastTarget = e.target
    dragOrigin = { x: e.screenX, y: e.screenY }
    e.preventDefault()
  })

  document.addEventListener('mousemove', e => {
    if (!dragging) return
    const dx = e.screenX - dragOrigin.x
    const dy = e.screenY - dragOrigin.y
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) hasMoved = true
    window.blopus.moveWindow(dx, dy)
    dragOrigin = { x: e.screenX, y: e.screenY }
  })

  document.addEventListener('mouseup', e => {
    if (!dragging) return
    dragging = false
    // Only toggle if click was on header and barely moved
    if (!hasMoved && lastTarget && (lastTarget === header || header.contains(lastTarget))) toggle()
  })

  // ── Toggle expand / collapse ──────────────────────────────────────────────
  function toggle() { expanded ? collapse() : expand() }

  function expand() {
    expanded = true
    notif.classList.remove('show')
    divider.style.display   = 'block'
    chatArea.style.display  = 'flex'
    pill.style.borderRadius = '20px'
    pill.style.height       = EXPANDED_H + 'px'
    chevron.classList.add('open')
    window.blopus.resize(EXPANDED_H)
    setTimeout(() => { messages.scrollTop = messages.scrollHeight; input.focus() }, 50)
  }

  function collapse() {
    expanded = false
    divider.style.display   = 'none'
    chatArea.style.display  = 'none'
    pill.style.borderRadius = '28px'
    pill.style.height       = '52px'
    chevron.classList.remove('open')
    if (preview.textContent) {
      notif.textContent = preview.textContent
      notif.classList.add('show')
      requestAnimationFrame(() => {
        const h = 52 + notif.offsetHeight + 18
        window.blopus.resize(h)
      })
    } else {
      window.blopus.resize(52)
    }
  }

  // ── Messages ──────────────────────────────────────────────────────────────
  function timeStr() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  }

  function renderMarkdown(s) {
    return s
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')  // escape first
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')                  // **bold**
      .replace(/\*(.+?)\*/g, '<em>$1</em>')                              // *italic*
      .replace(/^[-•] (.+)$/gm, '<li>$1</li>')                          // - bullets
      .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')                        // wrap ul
      .replace(/\n{2,}/g, '<br><br>')                                    // paragraph breaks
      .replace(/\n/g, '<br>')                                            // single breaks
  }

  function addMsg(from, text) {
    preview.textContent = from === 'blopus' ? text : `you: ${text}`

    if (!expanded) {
      notif.textContent = from === 'blopus' ? text : `you: ${text}`
      notif.classList.add('show')
      requestAnimationFrame(() => {
        const h = 52 + notif.offsetHeight + 18
        window.blopus.resize(h)
      })
    }

    if (from === 'blopus' && !expanded) {
      dot.classList.remove('pulse')
      void dot.offsetWidth
      dot.classList.add('pulse')
    }

    const el = document.createElement('div')
    el.className = `msg ${from}`
    el.innerHTML = `${renderMarkdown(text)}<div class="msg-time">${timeStr()}</div>`
    messages.appendChild(el)
    messages.scrollTop = messages.scrollHeight
  }

  // ── Send ──────────────────────────────────────────────────────────────────
  // Retry fetch up to 15 times with 2s gap (waits up to 30s for server boot)
  async function fetchWithRetry(url, opts, attempts = 15) {
    for (let i = 0; i < attempts; i++) {
      try { return await fetch(url, opts) } catch {}
      await new Promise(r => setTimeout(r, 2000))
    }
    throw new Error('server unreachable')
  }

  let thinking = null

  function showThinking() {
    thinking = document.createElement('div')
    thinking.className = 'msg blopus'
    thinking.innerHTML = '<span class="dots">●&thinsp;●&thinsp;●</span>'
    messages.appendChild(thinking)
    messages.scrollTop = messages.scrollHeight
  }

  function hideThinking() {
    if (thinking) { thinking.remove(); thinking = null }
  }

  async function send() {
    const text = input.value.trim()
    if (!text) return
    input.value = ''
    addMsg('user', text)
    showThinking()

    try {
      const res  = await fetchWithRetry('http://127.0.0.1:3847/message', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ message: text }),
      })
      const data = await res.json()
      hideThinking()
      addMsg('blopus', data.response ?? data.error ?? 'no response')
    } catch (e) {
      hideThinking()
      addMsg('blopus', 'could not reach brain server — check terminal for errors')
    }
  }

  sendBtn.addEventListener('click', send)
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() }
  })

  notif.addEventListener('click', () => { if (!expanded) expand() })

  // ── Safety reset — press Escape twice quickly ─────────────────────────────
  let escCount = 0
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return
    escCount++
    if (escCount >= 2) { window.blopus.resetPosition(); escCount = 0 }
    setTimeout(() => { escCount = 0 }, 600)
  })

  // ── Boot ──────────────────────────────────────────────────────────────────
  setTimeout(() => addMsg('blopus', "hey. i'm watching."), 600)
</script>

</body>
</html>
