<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blopus</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
      height: 100%;
    }

    /* ── Pill shell ─────────────────────────────────────────────────────── */
    #pill {
      width: 320px;
      background: linear-gradient(160deg,
        rgba(0, 20, 50, 0.92) 0%,
        rgba(0, 12, 38, 0.96) 100%);
      backdrop-filter: blur(60px) saturate(160%) brightness(0.75);
      -webkit-backdrop-filter: blur(60px) saturate(160%) brightness(0.75);
      border: 1px solid rgba(0, 210, 255, 0.28);
      border-radius: 28px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 0 60px rgba(0, 180, 255, 0.14);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* top cyan shimmer line */
    #pill::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(0, 220, 255, 0.55) 40%,
        rgba(100, 240, 255, 0.4) 60%,
        transparent);
      border-radius: 1px;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 52px;
      cursor: grab;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    #header:active { cursor: grabbing; }
    #header:hover { background: rgba(0, 200, 255, 0.04); }

    /* pulsing dot */
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #00d4ff;
      box-shadow: 0 0 8px #00d4ff, 0 0 20px rgba(0, 212, 255, 0.5);
      flex-shrink: 0;
      margin-right: 10px;
    }
    .dot.pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 6px #00d4ff, 0 0 16px rgba(0,212,255,0.4); opacity:1; }
      50%      { box-shadow: 0 0 16px #00d4ff, 0 0 40px rgba(0,212,255,0.6); opacity:0.7; }
    }

    /* brand */
    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(180, 235, 255, 0.95);
      flex-shrink: 0;
      margin-right: 10px;
      text-transform: lowercase;
    }

    /* preview */
    #preview {
      font-size: 12px;
      color: rgba(120, 195, 230, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* chevron */
    #chevron {
      font-size: 10px;
      color: rgba(0, 200, 255, 0.4);
      margin-left: 8px;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }
    #chevron.open { transform: rotate(180deg); }

    /* ── Divider ────────────────────────────────────────────────────────── */
    #divider {
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(0, 200, 255, 0.22) 30%,
        rgba(0, 220, 255, 0.15) 70%,
        transparent);
      flex-shrink: 0;
      display: none;
    }

    /* ── Chat area ──────────────────────────────────────────────────────── */
    #chat-area {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 200, 255, 0.2) transparent;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb {
      background: rgba(0, 200, 255, 0.25);
      border-radius: 2px;
    }

    .msg {
      max-width: 88%;
      padding: 8px 13px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.45;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* blopus bubble — glassy cyan tint */
    .msg.blopus {
      align-self: flex-start;
      background: rgba(0, 60, 110, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 190, 255, 0.22);
      border-bottom-left-radius: 4px;
      color: rgba(200, 235, 255, 0.95);
    }

    /* user bubble */
    .msg.user {
      align-self: flex-end;
      background: rgba(0, 30, 65, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 160, 210, 0.18);
      border-bottom-right-radius: 4px;
      color: rgba(160, 210, 240, 0.9);
    }

    .msg-time {
      font-size: 9.5px;
      color: rgba(0, 180, 220, 0.35);
      margin-top: 3px;
      text-align: right;
    }
    .msg.blopus .msg-time { text-align: left; }

    /* ── Input row ──────────────────────────────────────────────────────── */
    #input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 13px;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      background: rgba(0, 40, 80, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 190, 255, 0.22);
      border-radius: 22px;
      padding: 9px 15px;
      font-size: 13px;
      font-family: inherit;
      color: rgba(200, 235, 255, 0.95);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #input::placeholder { color: rgba(0, 180, 230, 0.32); }
    #input:focus {
      border-color: rgba(0, 210, 255, 0.45);
      box-shadow: 0 0 0 3px rgba(0, 200, 255, 0.08),
                  0 0 16px rgba(0, 180, 255, 0.1);
    }

    #send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #00c8ff 0%, #0077e6 100%);
      box-shadow: 0 0 14px rgba(0, 200, 255, 0.4);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px rgba(0, 200, 255, 0.6);
    }
    #send-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

<div id="pill">
  <div id="header">
    <div class="dot pulse" id="dot"></div>
    <span class="brand">blopus</span>
    <span id="preview">hey. i'm watching.</span>
    <span id="chevron">▲</span>
  </div>

  <div id="divider"></div>

  <div id="chat-area">
    <div id="messages"></div>
    <div id="input-row">
      <input id="input" type="text" placeholder="say something..." autocomplete="off" />
      <button id="send-btn">➤</button>
    </div>
  </div>
</div>

<script>
  const COLLAPSED_H = 52
  const EXPANDED_H  = 480

  let expanded = false

  const pill     = document.getElementById('pill')
  const header   = document.getElementById('header')
  const divider  = document.getElementById('divider')
  const chatArea = document.getElementById('chat-area')
  const messages = document.getElementById('messages')
  const preview  = document.getElementById('preview')
  const dot      = document.getElementById('dot')
  const chevron  = document.getElementById('chevron')
  const input    = document.getElementById('input')
  const sendBtn  = document.getElementById('send-btn')

  // ── Manual drag ───────────────────────────────────────────────────────────
  let dragging = false
  let dragOrigin = null
  let hasMoved = false

  header.addEventListener('mousedown', e => {
    if (e.button !== 0) return
    dragging    = true
    hasMoved    = false
    dragOrigin  = { x: e.screenX, y: e.screenY }
    e.preventDefault()
  })

  document.addEventListener('mousemove', e => {
    if (!dragging) return
    const dx = e.screenX - dragOrigin.x
    const dy = e.screenY - dragOrigin.y
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) hasMoved = true
    window.blopus.moveWindow(dx, dy)
    dragOrigin = { x: e.screenX, y: e.screenY }
  })

  document.addEventListener('mouseup', e => {
    if (!dragging) return
    dragging = false
    // If mouse barely moved, treat as a click (toggle)
    if (!hasMoved) toggle()
  })

  // ── Toggle expand / collapse ──────────────────────────────────────────────
  function toggle() { expanded ? collapse() : expand() }

  function expand() {
    expanded = true
    divider.style.display   = 'block'
    chatArea.style.display  = 'flex'
    pill.style.borderRadius = '20px'
    chevron.classList.add('open')
    window.blopus.resize(EXPANDED_H)
    messages.scrollTop = messages.scrollHeight
    setTimeout(() => input.focus(), 80)
  }

  function collapse() {
    expanded = false
    divider.style.display   = 'none'
    chatArea.style.display  = 'none'
    pill.style.borderRadius = '28px'
    chevron.classList.remove('open')
    window.blopus.resize(COLLAPSED_H)
  }

  // ── Messages ──────────────────────────────────────────────────────────────
  function timeStr() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  function addMsg(from, text) {
    preview.textContent = from === 'blopus' ? text : `you: ${text}`

    if (from === 'blopus' && !expanded) {
      dot.classList.remove('pulse')
      void dot.offsetWidth
      dot.classList.add('pulse')
    }

    const el = document.createElement('div')
    el.className = `msg ${from}`
    el.innerHTML = `${escHtml(text)}<div class="msg-time">${timeStr()}</div>`
    messages.appendChild(el)
    messages.scrollTop = messages.scrollHeight
  }

  // ── Send ──────────────────────────────────────────────────────────────────
  function send() {
    const text = input.value.trim()
    if (!text) return
    input.value = ''
    addMsg('user', text)
    setTimeout(() => addMsg('blopus', 'received'), 380)
  }

  sendBtn.addEventListener('click', send)
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() }
  })

  // ── Boot ──────────────────────────────────────────────────────────────────
  setTimeout(() => addMsg('blopus', "hey. i'm watching."), 600)
</script>

</body>
</html>
